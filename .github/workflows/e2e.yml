name: E2E

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      pnpm_config__auth: '{"https://npm.pkg.github.com/":{"@":{"authToken":"${{ secrets.GITHUB_TOKEN }}"}}}'
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.0

      - name: make install
        run: make -C .devtools install

      - name: Install the browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: make e2e
        run: make -C .devtools e2e
