name: E2E

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.0

      - name: make install
        run: make -C .devtools install

      - name: Install the browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: make e2e
        run: make -C .devtools e2e
